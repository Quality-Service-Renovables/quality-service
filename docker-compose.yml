services:
    qsr:
        build:
            context: ./
            dockerfile: .docker/Dockerfile
        image: qsr:build
        container_name: qsr
        hostname: qsr.localhost
        env_file:
            - .env
        ports:
            - ${APP_PORT:-80}:80
            - ${SSL_PORT:-443}:443
            - ${VITE_PORT:-5173}:5173
        networks:
            - net-sso
        extra_hosts:
            - "host.docker.internal:host-gateway"
        platform: linux/amd64
        volumes:
            - ./:/app
            - /app/vendor         # proteger dependencias PHP
            - /app/node_modules   # proteger dependencias JS
    mysql:
        image: 'mysql:8.3.0'
        container_name: database
        hostname: database
        ports:
            - '${MYSQL_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_HOST: '%'
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
        env_file:
            - .env
        volumes:
            - mysql:/var/lib/mysql
        networks:
            - net-databases
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-p${DB_PASSWORD}"]
            retries: 3
            timeout: 5s
networks:
    net-sso:
        driver: bridge
    net-databases:
        driver: bridge
volumes:
    dumps:
    mysql:
